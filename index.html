<!DOCTYPE html> 
<html>
    <head>
        <title>Football Squad Builder</title>
        <style>
            body {
                background-color:rgb(26, 25, 25);
                display:flex;
                flex-direction:row;
                justify-content:center;
            }

            .pitch {
                background-color:rgb(11, 185, 69);
                height:80vh;
                width:80vh;
                display:flex;
                flex-direction:column;
                justify-content:space-around;
            }

            .player_box {
                background-color:rgb(187, 186, 186);
                height:8vh;
                width:8vh;
                margin-top:5vh;
                border-radius:50%;
            }

            .row {
                display:flex;
                flex-direction:row;
                justify-content:space-around;
            }

            @media (hover:hover) {
                .player_box:hover {
                    opacity:0.9;
                    background-color:rgb(233, 230, 230);
                }
            }

            .player_box:active {
                opacity:0.9;
                background-color:rgb(233, 230, 230);
            }

            @media (hover:hover) {
                .select:hover {
                    background-color:rgb(129, 127, 127);
                }
            }

            #list {
                background-color:gray;
                height:80vh;
                width:50vh;
                margin-left:5vh;
                display:none;
                position:fixed;
                right:2vh;
                flex-direction:column;
                align-items:center;
            }

            .select {
                background-color:rgb(185, 183, 183);
                color:white;
                border-color:black;
                height:20vh;
                width:47vh;
                display:grid;
                grid-template-rows: auto 10vh;
                margin-top:4px;
            }

            .box_small {
                border-style:solid;
                border-color:black;
                border-width:2px;
                border-bottom:none;
                font-family:Verdana, Courier, sans-serif;
                font-weight:bold;
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
            }

            .box_large {
                border-style:solid;
                border-color:black;
                border-width:2px;
                font-weight:bold;
                font-family:Verdana, Courier, sans-serif;
                display:grid;
                align-items:center;
                grid-template-columns:repeat(6, auto);
                grid-template-rows:auto auto;
                font-size:2vh;
            }

            .box_text {
                display:flex;
                flex-direction:row;
                justify-content:center;
                align-items:center;
                height:4vh;
                width:4vh;
                margin-left:2vh;
            }

            #infobox {
                display:flex;
                flex-direction:row;
                justify-content:space-around;
            }

            .small_box {
                display:flex;
                flex-direction:column;
                justify-content:center;
                align-items:center;
            }
        </style>
    </head>
    <body>
        <div class="pitch">
            <div class="row">
            <div class="player_box"></div>
            <div class="player_box"></div>
            <div class="player_box"></div>
            </div>
            <div class="row">
            <div class="player_box"></div>
            <div class="player_box"></div>
            <div class="player_box"></div>
            </div>
            <div class="row">
            <div class="player_box"></div>
            <div class="player_box"></div>
            <div class="player_box"></div>
            <div class="player_box"></div>
            </div>
            <div class="row">
            <div id="gk" class="player_box"></div>
            </div>
        </div>
        <div id="list"></div>
        <script src="FSB.js"></script>
    </body>
</html>
